<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Кликер</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .score-board {
            font-size: 32px;
            font-weight: bold;
            color: #0984e3;
            margin-bottom: 10px;
        }

        .cps-board {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 30px;
        }

        .clicker-btn {
            background-color: #00b894;
            color: white;
            border: none;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #00a884;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            margin-bottom: 30px;
        }

        .clicker-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #00a884;
        }

        .upgrade-section {
            border-top: 1px solid #dfe6e9;
            padding-top: 20px;
        }

        .upgrade-btn {
            background-color: #ffeaa7;
            color: #2d3436;
            border: 1px solid #fdcb6e;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #fdcb6e;
        }

        .upgrade-btn:disabled {
            background-color: #f1f2f6;
            color: #b2bec3;
            border-color: #dfe6e9;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Энерго-Кликер</h1>
        <div class="score-board" id="score">0</div>
        <div class="cps-board">Энергия в секунду: <span id="cps">0</span></div>

        <button class="clicker-btn" id="clickBtn">ЖМИ!</button>

        <div class="upgrade-section">
            <button class="upgrade-btn" id="upgradeBtn" disabled>
                Купить генератор (Цена: <span id="upgradeCost">15</span>)
            </button>
        </div>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;
        let cps = 0;
        let upgradeCost = 15;
        let upgradeCount = 0;

        const scoreElement = document.getElementById('score');
        const cpsElement = document.getElementById('cps');
        const clickBtn = document.getElementById('clickBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const upgradeCostElement = document.getElementById('upgradeCost');

        clickBtn.addEventListener('click', () => {
            score += clickPower;
            updateDisplay();
        });

        upgradeBtn.addEventListener('click', () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                upgradeCount++;
                cps += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                updateDisplay();
            }
        });

        setInterval(() => {
            if (cps > 0) {
                score += cps;
                updateDisplay();
            }
        }, 1000);

        function updateDisplay() {
            scoreElement.textContent = Math.floor(score);
            cpsElement.textContent = cps;
            upgradeCostElement.textContent = upgradeCost;

            if (score >= upgradeCost) {
                upgradeBtn.removeAttribute('disabled');
            } else {
                upgradeBtn.setAttribute('disabled', 'true');
            }
        }
    </script>

<div class="beal-site-footer" style="margin-top:24px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#9aa3c4;text-align:center;background:rgba(0,0,0,.12);">🌐 Наш сайт: <a href="https://bealai.neocities.org/" target="_blank" rel="noopener noreferrer" style="color:#22d3ee;text-decoration:none;">bealai.neocities.org</a></div>
</body>
</html>
