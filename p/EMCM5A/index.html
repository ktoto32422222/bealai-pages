<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кликер с экраном загрузки</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
        }
        
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 250px;
        }

        h1, h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }

        p {
            font-size: 16px;
            color: #555;
            margin: 10px 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        #upgradeBtn {
            background-color: #008CBA;
            margin-top: 10px;
            font-size: 14px;
        }

        #upgradeBtn:hover {
            background-color: #007bb5;
        }

        .loader-container {
            width: 300px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            padding: 3px;
        }

        .loader-bar {
            width: 0%;
            height: 20px;
            background-color: #4CAF50;
            border-radius: 7px;
            transition: width 0.1s linear;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loaderScreen" class="screen active">
        <h2>Запуск игры, пожалуйста, подождите...</h2>
        <div class="loader-container">
            <div class="loader-bar" id="bar"></div>
        </div>
        <div id="status">0%</div>
    </div>

    <!-- Экран кликера -->
    <div id="gameScreen" class="screen">
        <div class="card">
            <h1>Мой кликер</h1>
            <p id="scoreLabel">Очки: 0</p>
            <p id="powerLabel">Сила клика: 1</p>
            <button onclick="clickAction()">Кликни меня!</button>
            <button id="upgradeBtn" onclick="buyUpgrade()">Купить улучшение (Цена: 10)</button>
        </div>
    </div>

    <script>
        let bar = document.getElementById('bar');
        let status = document.getElementById('status');
        let loaderScreen = document.getElementById('loaderScreen');
        let gameScreen = document.getElementById('gameScreen');
        let width = 0;

        let interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                status.innerText = "Готово!";
                setTimeout(() => {
                    loaderScreen.classList.remove('active');
                    gameScreen.classList.add('active');
                }, 500);
            } else {
                width += 2;
                bar.style.width = width + '%';
                status.innerText = width + '%';
            }
        }, 40);

        let score = 0;
        let clickPower = 1;
        let upgradeCost = 10;

        function clickAction() {
            score += clickPower;
            updateDisplay();
        }

        function buyUpgrade() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('scoreLabel').innerText = "Очки: " + score;
            document.getElementById('powerLabel').innerText = "Сила клика: " + clickPower;
            document.getElementById('upgradeBtn').innerText = "Купить улучшение (Цена: " + upgradeCost + ")";
        }
    </script>

</body>
</html>
