<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Мессенджер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="messenger-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Чаты</h2>
            </div>
            <div class="chat-list">
                <div class="chat-item active">
                    <div class="avatar">А</div>
                    <div class="chat-info">
                        <h3>Алексей</h3>
                        <p>Привет! Как дела?</p>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="avatar">М</div>
                    <div class="chat-info">
                        <h3>Мария</h3>
                        <p>Встретимся завтра?</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <div class="avatar">А</div>
                <div class="chat-info">
                    <h3>Алексей</h3>
                    <span class="status">в сети</span>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="message incoming">
                    <p>Привет! Как дела с проектом?</p>
                    <span class="time">12:00</span>
                </div>
                <div class="message outgoing">
                    <p>Привет! Всё идет по плану, скоро закончу.</p>
                    <span class="time">12:01</span>
                </div>
            </div>

            <form class="message-form" id="messageForm">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off" required>
                <button type="submit">Отправить</button>
            </form>
        </main>
    </div>

    <script src="script.js"></script>

<div class="beal-site-footer" style="margin-top:24px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#9aa3c4;text-align:center;background:rgba(0,0,0,.12);">🌐 Наш сайт: <a href="https://bealai.neocities.org/" target="_blank" rel="noopener noreferrer" style="color:#22d3ee;text-decoration:none;">bealai.neocities.org</a></div>
</body>
</html>
