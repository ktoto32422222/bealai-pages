<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой кликер с бонусами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Космический Кликер</h1>
        <div class="score-board">
            <p>Монеты: <span id="score">0</span></p>
            <p>Кликов: <span id="click-count">0</span> / 100</p>
            <p>В секунду: <span id="cps">0</span></p>
        </div>
        
        <div class="clicker-area">
            <button id="click-btn">Клик!</button>
        </div>

        <div class="shop">
            <h2>Магазин</h2>
            <div class="upgrade-item">
                <span>Авто-клик (Цена: <span id="cost-auto">15</span>)</span>
                <button id="buy-auto">Купить</button>
            </div>
            <div class="upgrade-item">
                <span>Сильный клик (+1) (Цена: <span id="cost-power">50</span>)</span>
                <button id="buy-power">Купить</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

<div class="beal-site-footer" style="margin-top:24px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#9aa3c4;text-align:center;background:rgba(0,0,0,.12);">🌐 Наш сайт: <a href="https://bealai.neocities.org/" target="_blank" rel="noopener noreferrer" style="color:#22d3ee;text-decoration:none;">bealai.neocities.org</a></div>
</body>
</html>
